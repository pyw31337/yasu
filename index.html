<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>야수의 심장 1980</title>
<style>
  :root {
    --bg: #05060a;
    --panel: #0f1118;
    --accent: #ff4d00;
    --gold: #ffd54a;
    --good: #00e676;
    --bad: #ff5252;
    --text: #f5f5f5;
    --muted: #8a8a9a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .bg-layer {
    position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(ellipse at 50% 0%, #1a0a0a 0%, #05060a 60%);
  }
  .container { max-width: 1000px; margin: 0 auto; padding: 16px; position: relative; }
  header { text-align: center; padding: 28px 16px 16px; }
  h1 { font-size: 2.2rem; color: var(--accent); text-shadow: 0 0 18px #ff4d0088; }
  .subtitle { opacity: 0.8; margin-top: 4px; }
  .btn {
    background: #2563eb; color: white; border: none; padding: 12px 28px;
    border-radius: 8px; cursor: pointer; font-weight: 600; margin: 6px;
    transition: 0.15s;
  }
  .btn:hover { background: #1d4ed8; transform: translateY(-1px); }
  .btn.secondary { background: #333; }
  .btn.danger { background: var(--bad); }
  .card {
    background: var(--panel); border-radius: 16px; padding: 18px; margin: 12px 0;
    border: 1px solid #222230; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .heart-wrap { display: flex; justify-content: center; margin: 8px 0 16px; }
  .beast-heart {
    width: 72px; height: 72px;
    filter: drop-shadow(0 0 16px var(--accent));
  }
  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin: 12px 0;
  }
  .stat { background: #0a0c12; padding: 12px; border-radius: 12px; text-align: center; }
  .stat .label { font-size: 0.75rem; color: var(--muted); }
  .stat .value { font-size: 1.3rem; font-weight: 700; color: var(--gold); margin-top: 2px; }
  .risk-bar { height: 10px; background: #1a1a22; border-radius: 5px; overflow: hidden; margin: 8px 0 4px; }
  .risk-fill { height: 100%; background: linear-gradient(90deg, #00e676, #ffd54a, #ff5252); width: 0%; transition: width 0.4s; }
  canvas#chart { width: 100%; height: 160px; background: #080a10; border-radius: 12px; display: block; margin: 10px 0; }
  .news {
    border-left: 4px solid var(--accent); padding: 14px 16px; margin: 10px 0;
    background: #1a1012; border-radius: 0 12px 12px 0;
    animation: slideIn 0.45s ease-out;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  label { display: block; margin: 10px 0 4px; }
  .hidden { display: none !important; }
  .end-screen { text-align: center; padding: 48px 16px; }
  .positive { color: var(--good); }
  .negative { color: var(--bad); }
  #log { max-height: 140px; overflow-y: auto; font-size: 0.82rem; color: #aaa; margin-top: 8px; }
  #log div { padding: 3px 0; border-bottom: 1px solid #1a1a22; }
  .year-badge { background: var(--accent); color: #000; font-weight: 800; padding: 4px 14px; border-radius: 20px; }
  .choice-btn {
    display: block; width: 100%; text-align: left; margin: 6px 0; padding: 12px;
    background: #161822; border: 1px solid #333; border-radius: 10px; color: var(--text); cursor: pointer;
  }
  .choice-btn:hover { border-color: var(--accent); background: #1e2030; }
  .toast {
    position: fixed; top: 20px; right: 20px; background: #161822; border: 1px solid var(--accent);
    padding: 14px 18px; border-radius: 12px; z-index: 100; animation: toastIn 0.3s;
    max-width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  .flash { animation: flash 0.5s; }
  @keyframes flash { 0% { filter: brightness(1.6); } 100% { filter: none; } }
  footer { text-align: center; padding: 16px; color: var(--muted); font-size: 0.75rem; }
</style>
</head>
<body>
<div class="bg-layer"></div>

<div id="landing">
  <header>
    <div class="heart-wrap">
      <svg class="beast-heart" viewBox="0 0 100 100">
        <path d="M50 85 C20 60 5 40 20 20 C35 5 50 25 50 25 C50 25 65 5 80 20 C95 40 80 60 50 85Z" fill="#ff4d00"/>
        <circle cx="50" cy="40" r="8" fill="#ffd54a"/>
      </svg>
    </div>
    <h1>야수의 심장 1980</h1>
    <p class="subtitle">1980년, 1,000만원으로 시작하는 주식 투자 생존 시뮬레이션</p>
    <p style="margin-top:10px;">레버리지·사채·역사의 파고를 넘고 2025년까지 살아남아라.</p>
  </header>
  <div class="container" style="text-align:center; padding-top:24px;">
    <button class="btn" onclick="startGame()">게임 시작</button>
    <button class="btn secondary" onclick="loadGame()">이어하기</button>
  </div>
</div>

<div id="game" class="hidden container">
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <svg class="beast-heart" id="gameHeart" viewBox="0 0 100 100" style="width:48px;height:48px;">
          <path d="M50 85 C20 60 5 40 20 20 C35 5 50 25 50 25 C50 25 65 5 80 20 C95 40 80 60 50 85Z" fill="#ff4d00"/>
        </svg>
        <h2 id="yearDisplay" style="margin:0;">1980년</h2>
      </div>
      <span class="year-badge" id="progress">1 / 46</span>
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="label">총자산</div><div class="value" id="assets">10,000,000</div></div>
      <div class="stat"><div class="label">부채</div><div class="value" id="debt">0</div></div>
      <div class="stat"><div class="label">순자산</div><div class="value" id="net">10,000,000</div></div>
      <div class="stat"><div class="label">레버리지</div><div class="value" id="lev">1.0x</div></div>
    </div>

    <div class="risk-bar"><div class="risk-fill" id="riskFill"></div></div>
    <div style="font-size:0.8rem; color:#aaa; text-align:center;" id="riskLabel">리스크: 낮음</div>

    <canvas id="chart"></canvas>
    <div id="newsArea"></div>
    <div id="choiceArea"></div>

    <div class="card" style="margin-top:8px; background:#0c0e14;">
      <label>주식 비중: <span id="stockPct">60</span>%</label>
      <input type="range" id="stockSlider" min="0" max="100" value="60" oninput="document.getElementById('stockPct').textContent=this.value; updateRiskPreview()">
      <label>레버리지 배율: <span id="levPct">1.0</span>x</label>
      <input type="range" id="levSlider" min="10" max="50" value="10" oninput="document.getElementById('levPct').textContent=(this.value/10).toFixed(1); updateRiskPreview()">
      <div style="margin-top:14px; text-align:center;">
        <button class="btn" onclick="nextYear()">다음 해로 진행</button>
        <button class="btn secondary" onclick="saveGame()">저장</button>
      </div>
    </div>

    <div id="log"></div>
    <div id="achievements" style="margin-top:8px; font-size:0.8rem; color:#aaa;"></div>
  </div>
</div>

<div id="end" class="hidden end-screen">
  <h1 id="endTitle" style="font-size:2rem; margin-bottom:12px;"></h1>
  <p id="endMessage" style="font-size:1.05rem; line-height:1.7;"></p>
  <div id="endStats" style="margin:16px 0;"></div>
  <button class="btn" onclick="location.reload()">다시 도전</button>
</div>

<footer>야수의 심장 1980 · 역사적 사실 기반 코스피 생존 시뮬레이션</footer>

<script>
const KOSPI = {
  1980: 0.07, 1981: 0.23, 1982: -0.018, 1983: -0.060, 1984: 0.175,
  1985: 0.147, 1986: 0.669, 1987: 0.926, 1988: 0.728, 1989: 0.003,
  1990: -0.235, 1991: -0.122, 1992: 0.111, 1993: 0.277, 1994: 0.186,
  1995: -0.141, 1996: -0.262, 1997: -0.422, 1998: 0.499, 1999: 0.828,
  2000: -0.509, 2001: 0.375, 2002: -0.095, 2003: 0.292, 2004: 0.105,
  2005: 0.540, 2006: 0.040, 2007: 0.323, 2008: -0.407, 2009: 0.497,
  2010: 0.219, 2011: -0.110, 2012: 0.094, 2013: 0.007, 2014: -0.048,
  2015: 0.024, 2016: 0.033, 2017: 0.218, 2018: -0.173, 2019: 0.077,
  2020: 0.308, 2021: 0.036, 2022: -0.249, 2023: 0.187, 2024: -0.096,
  2025: 0.756
};

const EVENTS = {
  1980: "박정희 대통령 서거 여파와 전두환 신군부. 정치적 불안과 건설주 후유증이 시장을 짓누른다.",
  1981: "신군부 정권 안정화 시도. 증시는 바닥에서 서서히 반등 조짐을 보인다.",
  1985: "플라자 합의 이후 3저 호황(저유가·저금리·저환율)의 서막. 수출 기업들이 기지개를 켜다.",
  1986: "3저 호황이 본격화. 무역수지 흑자와 경기 과열 조짐.",
  1987: "서울 올림픽을 1년 앞두고 경기가 뜨겁다. 10월 블랙먼데이의 충격이 바다를 건너온다.",
  1988: "서울 올림픽 개최. 국민적 자부심과 함께 증시가 폭등한다.",
  1989: "코스피 사상 첫 1,000 돌파! 그러나 과열과 깡통계좌 우려가 커지고 있다.",
  1990: "거품 붕괴 시작. 부동산 과열과 증시 조정.",
  1995: "외환위기 전조. 엔고와 수출 경쟁력 약화 우려.",
  1997: "아시아 외환위기. 한보·기아 등 대기업 연쇄 부도. 12월 IMF 구제금융 신청.",
  1998: "IMF 관리 체제. 코스피 280선까지 추락. 고금리·구조조정·정리해고의 시대.",
  1999: "닷컴 버블. 코스닥이 뜨겁다. 새롬기술·다음 등이 폭등하며 개인 투자자 열풍.",
  2000: "IT 버블 붕괴. 코스피 반토막. 9·11 테러 여파까지 겹친다.",
  2001: "9·11 테러 직후 패닉. 그러나 IT 회복과 함께 반등.",
  2007: "서브프라임 위기 조짐. 코스피 2,000 돌파의 환희.",
  2008: "글로벌 금융위기. 리먼 브라더스 파산. 코스피 1,000 붕괴. '도시락 폭탄' 장세.",
  2009: "금융위기 바닥 탈출. 강력한 반등 시작.",
  2010: "유럽 재정위기 속 코스피 2,000 재돌파.",
  2018: "미중 무역전쟁 본격화. 반도체 사이클 조정.",
  2020: "코로나19 팬데믹. 3월 폭락 후 역대급 유동성 장세.",
  2022: "인플레이션과 금리 인상. 우크라이나 전쟁 충격.",
  2025: "역사적 대세 상승. 코스피 4,000 시대 진입."
};

const DECISIONS = {
  1997: [
    { text: "보수적으로 레버리지 축소", effect: { levMod: -0.5 } },
    { text: "위기를 기회로 더 공격적 매수", effect: { levMod: 0.3, retMod: -0.05 } },
    { text: "현상 유지", effect: {} }
  ],
  1999: [
    { text: "닷컴 열풍에 적극 참여", effect: { retMod: 0.08 } },
    { text: "거품을 의심하고 현금 비중 확대", effect: { retMod: -0.1 } },
    { text: "중립", effect: {} }
  ],
  2008: [
    { text: "패닉 셀, 현금 확보", effect: { retMod: -0.08, debtRelief: 0.2 } },
    { text: "바닥 매수 시도", effect: { retMod: 0.05, levMod: 0.2 } },
    { text: "버틴다", effect: {} }
  ],
  2020: [
    { text: "코로나 폭락 때 풀매수", effect: { retMod: 0.1 } },
    { text: "유동성 장세 의심, 일부 차익", effect: { retMod: -0.05 } },
    { text: "유지", effect: {} }
  ]
};

let state = {
  year: 1980, cash: 10000000, stocks: 0, debt: 0,
  history: [], achievements: new Set(), pendingEffect: null
};

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, duration, type = 'sine', gain = 0.08) {
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function playUp() { playTone(440, 0.12); setTimeout(() => playTone(550, 0.16), 80); }
function playDown() { playTone(280, 0.22, 'sawtooth', 0.06); }
function playAlert() { playTone(780, 0.08); setTimeout(() => playTone(580, 0.12), 100); }
function playSuccess() { playTone(523, 0.18); setTimeout(() => playTone(659, 0.22), 140); setTimeout(() => playTone(784, 0.28), 280); }

function format(n) { return Math.round(n).toLocaleString('ko-KR') + "원"; }
function getNet() { return state.cash + state.stocks - state.debt; }

function updateHeart() {
  const heart = document.getElementById("gameHeart");
  if (!heart) return;
  const lev = parseInt(document.getElementById("levSlider")?.value || 10) / 10;
  const intensity = Math.min(1.4, 0.8 + (lev - 1) * 0.15);
  heart.style.transform = `scale(${intensity})`;
  heart.style.filter = `drop-shadow(0 0 ${12 + lev * 6}px #ff4d00)`;
}

function updateRiskPreview() {
  const lev = parseInt(document.getElementById("levSlider").value) / 10;
  const stock = parseInt(document.getElementById("stockSlider").value) / 100;
  const risk = Math.min(100, (lev - 1) * 35 + stock * 28);
  document.getElementById("riskFill").style.width = risk + "%";
  const label = risk < 30 ? "낮음" : risk < 60 ? "중간" : risk < 85 ? "높음" : "매우 높음";
  document.getElementById("riskLabel").textContent = `리스크: ${label}`;
  updateHeart();
}

function drawChart() {
  const canvas = document.getElementById("chart");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const w = canvas.width = canvas.offsetWidth;
  const h = canvas.height = 160;
  ctx.clearRect(0, 0, w, h);
  if (state.history.length < 2) return;
  const nets = state.history.map(h => h.net);
  const min = Math.min(...nets, 0);
  const max = Math.max(...nets);
  const range = max - min || 1;
  ctx.strokeStyle = "#ff4d00";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  nets.forEach((n, i) => {
    const x = (i / (nets.length - 1)) * (w - 16) + 8;
    const y = h - 12 - ((n - min) / range) * (h - 24);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = "rgba(255,77,0,0.12)";
  ctx.lineTo(w - 8, h - 6);
  ctx.lineTo(8, h - 6);
  ctx.fill();
}

function showToast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
  playAlert();
}

function checkAchievements() {
  const net = getNet();
  const ach = state.achievements;
  if (net >= 50000000 && !ach.has("50M")) { ach.add("50M"); showToast("🏆 성취: 순자산 5천만 원 돌파"); }
  if (net >= 100000000 && !ach.has("100M")) { ach.add("100M"); showToast("🏆 성취: 1억 원 돌파"); }
  if (net >= 1000000000 && !ach.has("1B")) { ach.add("1B"); showToast("🏆 성취: 10억 원 돌파"); }
  if (state.year >= 1998 && !ach.has("IMF")) { ach.add("IMF"); showToast("🏆 성취: IMF 외환위기 생존"); }
  if (state.year >= 2009 && !ach.has("GFC")) { ach.add("GFC"); showToast("🏆 성취: 글로벌 금융위기 생존"); }
  if (state.year >= 2021 && !ach.has("COVID")) { ach.add("COVID"); showToast("🏆 성취: 코로나 장세 생존"); }
  document.getElementById("achievements").textContent = "성취: " + [...ach].join(", ") || "성취 없음";
}

function startGame() {
  document.getElementById("landing").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  audioCtx.resume();
  updateUI();
  showNews(1980);
  updateRiskPreview();
  drawChart();
}

function showNews(y) {
  const news = EVENTS[y] || "시장은 비교적 조용히 흐러간다. 개인의 선택만이 결과를 가른다.";
  document.getElementById("newsArea").innerHTML = `<div class="news"><strong>${y}년</strong> — ${news}</div>`;
  const choices = DECISIONS[y];
  const area = document.getElementById("choiceArea");
  if (choices) {
    area.innerHTML = `<div style="margin:8px 0; font-size:0.9rem; color:#ffd54a;">⚡ 역사적 선택:</div>`;
    choices.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = c.text;
      btn.onclick = () => {
        state.pendingEffect = c.effect;
        area.innerHTML = `<div style="color:#00e676; font-size:0.85rem;">선택됨: ${c.text}</div>`;
        playTone(600, 0.08);
      };
      area.appendChild(btn);
    });
  } else {
    area.innerHTML = "";
    state.pendingEffect = null;
  }
}

function updateUI() {
  const totalAssets = state.cash + state.stocks;
  const net = getNet();
  document.getElementById("yearDisplay").textContent = state.year + "년";
  document.getElementById("progress").textContent = (state.year - 1979) + " / 46";
  document.getElementById("assets").textContent = format(totalAssets);
  document.getElementById("debt").textContent = format(state.debt);
  document.getElementById("net").textContent = format(net);
  document.getElementById("net").className = "value " + (net >= 0 ? "positive" : "negative");
  document.getElementById("lev").textContent = (document.getElementById("levSlider").value / 10).toFixed(1) + "x";
  checkAchievements();
  drawChart();
  updateHeart();
}

function nextYear() {
  if (state.year >= 2025) { endGame(true); return; }

  const stockPct = parseInt(document.getElementById("stockSlider").value) / 100;
  let lev = parseInt(document.getElementById("levSlider").value) / 10;
  let retMod = 0;
  if (state.pendingEffect) {
    if (state.pendingEffect.levMod) lev = Math.max(1, lev + state.pendingEffect.levMod);
    if (state.pendingEffect.retMod) retMod = state.pendingEffect.retMod;
    if (state.pendingEffect.debtRelief) state.debt *= (1 - state.pendingEffect.debtRelief);
  }

  const isCrisis = [1997,1998,2000,2008,2020,2022].includes(state.year);
  const interestRate = isCrisis ? 0.24 : 0.16;
  if (state.debt > 0) state.debt *= (1 + interestRate);

  let equity = getNet();
  if (equity <= 0) { endGame(false); return; }

  const targetStock = equity * stockPct * lev;
  const cashNeeded = equity - targetStock;

  if (cashNeeded < 0) {
    state.debt += Math.abs(cashNeeded);
    state.cash = 0;
    state.stocks = targetStock;
  } else {
    state.cash = cashNeeded;
    state.stocks = targetStock;
    if (state.debt > 0 && state.cash > state.debt * 0.25) {
      const repay = Math.min(state.debt, state.cash * 0.4);
      state.debt -= repay;
      state.cash -= repay;
    }
  }

  state.cash *= (1 + (state.year < 2000 ? 0.07 : 0.035));

  state.year++;
  let ret = (KOSPI[state.year] ?? 0.05) + retMod;
  state.stocks *= (1 + ret);

  const net = getNet();
  state.history.push({ year: state.year, ret, net });

  if (net <= 0) { endGame(false); return; }

  showNews(state.year);
  updateUI();
  const retPct = (ret * 100).toFixed(1);
  const color = ret >= 0 ? "positive" : "negative";
  const log = document.getElementById("log");
  log.innerHTML = `<div class="${color}">${state.year}년 수익률 ${retPct}%</div>` + log.innerHTML;
  if (ret >= 0) playUp(); else playDown();
}

function endGame(survived) {
  document.getElementById("game").classList.add("hidden");
  document.getElementById("end").classList.remove("hidden");
  const net = getNet();
  if (survived) {
    document.getElementById("endTitle").textContent = "생존 성공";
    document.getElementById("endMessage").textContent = `최종 순자산 ${format(net)}. 역사의 파고를 넘었다.`;
    playSuccess();
  } else {
    document.getElementById("endTitle").textContent = "파산";
    document.getElementById("endMessage").textContent = `부채에 짓눈려 생존에 실패했다. 최종 순자산 ${format(net)}.`;
    playDown();
  }
  document.getElementById("endStats").innerHTML = `<div>최종 연도: ${state.year}</div>`;
}

function saveGame() {
  localStorage.setItem("yasu", JSON.stringify({...state, achievements: [...state.achievements]}));
  showToast("저장 완료");
}

function loadGame() {
  const s = localStorage.getItem("yasu");
  if (!s) { showToast("저장된 게임이 없습니다"); return; }
  const data = JSON.parse(s);
  state = {...data, achievements: new Set(data.achievements || [])};
  startGame();
  showToast("이어하기 완료");
}
</script>
</body>
</html>
